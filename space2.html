<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>장소번역: 다른 시선 같은 장소</title>

  <link rel="stylesheet" href="style2.css">

  <!-- 기본 정보 -->
  <meta
    name="description"
    content="위에서 봤을 때 누워서 봤을 때"
  >

  <!-- Open Graph / 카카오톡 -->
  <meta property="og:type" content="website">

  <meta
    property="og:url"
    content="https://vegemeel.github.io/sameplace-differentviews/space2.html"
  >

  <meta
    property="og:title"
    content="장소번역: 다른 시선 같은 장소"
  >

  <meta
    property="og:description"
    content="위에서 봤을 때 누워서 봤을 때"
  >

  <meta
    property="og:image"
    content="https://vegemeel.github.io/sameplace-differentviews/cover2.png"
  >

  <meta
    property="og:image:type"
    content="image/png"
  >

  <!-- X / Twitter -->
  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:url"
    content="https://vegemeel.github.io/sameplace-differentviews/space2.html"
  >

  <meta
    name="twitter:title"
    content="장소번역: 다른 시선 같은 장소"
  >

  <meta
    name="twitter:description"
    content="위에서 봤을 때 누워서 봤을 때"
  >

  <meta
    name="twitter:image"
    content="https://vegemeel.github.io/sameplace-differentviews/cover2.png"
  >

</head>

<body>

  <!-- 왼쪽 상단 -->
  <div class="circle"></div>
  <div class="tower tower1"></div>
  <div class="tower tower2"></div>

  <!-- 왼쪽 몸체 -->
  <div class="body"></div>

  <!-- 위쪽 흰 공간 -->
  <div class="white upper-space"></div>

  <!-- 위쪽 검은 계단 -->
  <div class="upper-step step1"></div>
  <div class="upper-step step2"></div>
  <div class="upper-step step3"></div>
  <div class="upper-step step4"></div>

  <!-- 아래쪽 흰 공간 -->
  <div class="white lower-space"></div>

  <!-- 아래쪽 검은 계단 -->
  <div class="lower-step lstep1"></div>
  <div class="lower-step lstep2"></div>
  <div class="lower-step lstep3"></div>
  <div class="lower-step lstep4"></div>

  <!-- 오른쪽 위 사각형 -->
  <div class="right-top"></div>

  <!-- 오른쪽 T자 -->
  <div class="right-head"></div>
  <div class="right-leg"></div>

</body>

</html>
